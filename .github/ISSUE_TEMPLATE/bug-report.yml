name: "Bug report"
description: Something is broken, other than a wrong match or missing technology.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a **wrong product or wrong dates**, please use the false-match template instead.
        For something the tool does not recognise, use the missing-technology template.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /check
        2. Paste ...
        3. Click "Check my stack"
    validations: {required: true}
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Firefox 130, Android"
  - type: textarea
    id: console
    attributes:
      label: Console errors, if any
      render: shell
